<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opening…</title>
<style>
  * { box-sizing: border-box }
  body { --accent: #e4ecfa; --header: #263951; margin: 0; font: 17px/1.5 system-ui, sans-serif; color: #20252e; background: #f5f6f9 }
  body[data-mission="link-inspector"], body[data-mission="tick-tock"] { --accent: #f9e6c8; --header: #5b3d23 }
  body[data-mission="spot-the-lookalike"] { --accent: #d8efe4; --header: #244b3e }
  body[data-mission="double-trouble"], body[data-mission="whos-the-boss"] { --accent: #e9e3fb; --header: #49406a }
  body[data-mission="popup-panic"] { --accent: #eeeef2; --header: #32333e }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--header); color: white; padding: 12px 26px; font-weight: 750 }
  main { max-width: 840px; margin: 25px auto; padding: 0 20px 28px }
  h1 { font-size: clamp(23px, 4vw, 38px); line-height: 1.12; letter-spacing: -.04em; margin: 4px 0 12px }
  p { margin: 5px 0 12px }
  article, section { background: white; padding: 20px 24px; border-radius: 20px }
  article { background: var(--accent) }
  body[data-mission="popup-panic"] article, body[data-mission="double-trouble"] article { max-width: 560px; margin: auto }
  button { border: 0; border-radius: 12px; background: var(--accent); color: #20252e; cursor: pointer; font: inherit; font-weight: 700; padding: 10px 16px; min-height: 44px; text-align: left }
  button:hover { filter: brightness(.95) }
  button:focus-visible { outline: 3px solid var(--header); outline-offset: 3px }
  button:disabled { cursor: default; opacity: .65 }
  #enter, #continue { background: var(--header); color: white; margin-top: 7px }
  #controls, #outcome { margin-top: 14px }
  #evidence { margin-top: 10px; overflow-wrap: anywhere; font: 15px/1.5 ui-monospace, monospace; background: #f5f6f9; border-radius: 12px; padding: 12px }
  #actions { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 11px }
  #timer { font: bold 21px ui-monospace, monospace; margin-top: 12px }
  #review { padding: 0 0 0 22px }
  #review li { margin-top: 9px }
  #sender { font-size: 15px; font-weight: 700 }
  #site { overflow: hidden; background: white; padding: 0; }
  .site-heading { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 20px 24px; background: var(--accent) }
  .site-heading h1 { margin: 0 }
  .site-heading p { margin: 0; font-size: 14px }
  .site-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; padding: 20px 24px 12px }
  .site-actions label { display: grid; gap: 5px; flex: 1; min-width: 200px; font-size: 14px; font-weight: 700 }
  .site-actions input { border: 0; border-radius: 10px; background: #f2f4f7; font: inherit; min-height: 44px; padding: 8px 12px }
  #site-bookmark { color: inherit; font-size: 15px; text-underline-offset: 4px }
  #site-task { color: white; background: var(--header) }
  #site-intro { padding: 0 24px; color: #475366 }
  #site-rows { display: grid; gap: 7px; padding: 0 24px 20px }
  .site-row { display: grid; grid-template-columns: 130px minmax(0, 1fr) auto; align-items: center; gap: 12px; background: #f7f8fb; width: 100% }
  .site-row[aria-pressed="true"] { background: var(--accent) }
  .site-row span { font-size: 14px; color: #445169 }
  #site[data-kind="news"] #site-rows, #site[data-kind="media"] #site-rows, #site[data-kind="workspace"] #site-rows { grid-template-columns: repeat(auto-fit, minmax(185px,1fr)) }
  #site[data-kind="news"] .site-row, #site[data-kind="media"] .site-row, #site[data-kind="workspace"] .site-row { grid-template-columns: 1fr; align-content: start; min-height: 120px; padding: 18px }
  #site[data-kind="media"] .site-row { background: #34374c; color: white }
  #site[data-kind="media"] .site-row span { color: #dfdfec }
  #site-detail { margin: 0 24px 22px; padding: 18px; background: var(--accent); border-radius: 12px }
  #site-detail h2 { margin: 0 0 8px; font-size: 20px }
  #site-detail p { margin: 0 }
  #clues { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px }
  .clue { display: grid; align-content: start; gap: 1px; background: #f2f4f7; overflow-wrap: anywhere; max-width: 100% }
  .clue[aria-pressed="true"] { background: var(--header); color: white }
  .clue span { font: 14px/1.4 ui-monospace, monospace }
  .review-clues { padding-left: 20px; font-size: 15px }
  @media(max-width:560px){ .site-row{grid-template-columns:1fr;gap:4px} .site-actions,.site-heading{padding-inline:14px} }
  [hidden] { display: none !important }
</style>
<style>
  main {max-width:1120px} header {min-height:60px;padding-inline:max(24px,calc((100vw - 1080px)/2));letter-spacing:-.025em;font-size:21px}
  #site .site-heading {padding:32px;align-items:baseline} #site-rows {align-content:start} #site-detail {align-self:start}
  #saved-view[aria-pressed=true] {background:var(--header);color:white}
  body[data-mission=link-inspector] h1 {font-family:Georgia,serif}
  body[data-mission=popup-panic] {background:#191b27} body[data-mission=popup-panic] #site {background:#ededf4}
  body[data-mission=whos-the-boss] #message {background:white;border-radius:4px 18px 18px;padding:16px;max-width:36em}
  body[data-mission=download-roulette] .site-row strong,body[data-mission=tick-tock] #subject {font-family:ui-monospace,monospace}
  @media(min-width:760px){
    #site {display:grid;grid-template-columns:minmax(0,3fr) minmax(240px,2fr)}
    #site .site-heading,#site .site-actions,#site-intro {grid-column:1/-1}
    #site-detail {margin-left:0} #site:has(#site-detail[hidden]) #site-rows {grid-column:1/-1}
    #scene {display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,.8fr);gap:18px;align-items:start}
    #controls {margin-top:0} #scene article {width:100%}
  }
  [hidden]{display:none!important}
</style>
<style>
  body {font-family:"Liberation Sans",Arial,sans-serif;background:#edf1f4;color:#1a2934}
  header {background:#fff;color:var(--header);font-weight:800;justify-content:flex-start;gap:12px}
  header::before {content:"";width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--header) 48%,transparent 48% 54%,var(--header) 54%);transform:rotate(-8deg)}
  #site-bookmark {margin-left:auto;color:var(--header)}
  main {max-width:1220px} #site {background:#fff;border-radius:18px}
  .site-heading {min-height:96px} .site-heading p {font-family:monospace}
  #site-intro {font-size:18px;font-weight:600;max-width:75ch;margin-bottom:20px}
  #site-rows {gap:1px}.site-row {border-radius:4px;background:#f8fafb;grid-template-columns:44px minmax(95px,.65fr) minmax(0,2fr) auto}
  .record-icon {display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:#dce8ff;color:#234b88;font:700 13px monospace}
  .tone-1 {background:#fde6cc;color:#694524}.tone-2 {background:#dbeddb;color:#285a41}
  .site-row img {width:100%;height:120px;object-fit:cover;border-radius:8px}
  #site[data-kind=news] .site-row,#site[data-kind=media] .site-row,#site[data-kind=workspace] .site-row {gap:6px;padding:11px;grid-template-columns:minmax(0,1fr)}
  #site[data-kind=news] .site-row strong {font:700 23px Georgia,serif}
  #site[data-kind=media] .site-heading {background:#25273a;color:white}
  #site[data-kind=chat] .record-icon {border-radius:50%}
  body[data-mission=popup-panic] #scene article {background:#202334;color:white}
  #scene article {padding:32px;min-height:210px} #scene article p {max-width:55ch}
  #scene #sender {display:inline-block;background:white;color:var(--header);border-radius:24px;padding:6px 12px;margin-bottom:24px}
  #controls {background:white;padding:24px} #actions button {background:var(--header);color:white}
  @media(max-width:650px){.site-row{grid-template-columns:40px 1fr}.site-row strong,.site-row span:last-child{grid-column:2}.site-row img~strong,.site-row img~span{grid-column:1}}
</style>
<header><span id="surface">Opening…</span><a id="site-bookmark" hidden>Open saved site</a></header>
<main>
  <section id="site" hidden>
    <div class="site-heading"><h1 id="site-section"></h1><p id="site-account"></p></div>
    <div class="site-actions">
      <label>Search <input id="site-search" type="search" placeholder="Search this site"></label>
      <button id="saved-view" aria-pressed="false">Saved records</button>
      <button id="site-task" type="button"></button>
    </div>
    <p id="site-intro"></p>
    <div id="site-rows"></div>
    <article id="site-detail" hidden><h2 id="site-detail-title"></h2><p id="site-detail-body"></p><button id="prepare-record" hidden></button> <button id="save-record"></button></article>
  </section>
  <div id="scene" hidden>
    <article>
      <p id="sender"></p>
      <h1 id="subject" tabindex="-1"></h1>
      <p id="message"></p>
      <button id="enter" hidden></button>
      <p id="timer" role="timer" hidden></p>
    </article>
    <section id="controls">
      <button id="inspect"></button>
      <p id="guide"></p>
      <p id="evidence" role="status" hidden></p>
      <div id="clues" aria-label="Tag suspicious details" hidden></div>
      <div id="actions" aria-label="Available actions"></div>
    </section>
  </div>
  <section id="outcome" hidden>
    <h1 id="outcome-title" tabindex="-1"></h1>
    <p id="consequence"></p>
    <div id="coaching"></div>
    <button id="continue">Continue</button>
    <ol id="review" hidden></ol>
  </section>
  <p id="error" role="alert"></p>
</main>
<script src="/play.js" defer></script>
